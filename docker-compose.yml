services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gvas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gvas"]
      interval: 2s
      timeout: 5s
      retries: 15
  app:
    build: .
    environment:
      GVAS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gvas
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
