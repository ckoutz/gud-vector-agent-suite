            - item: technician
              state: satisfied
              evidence_contains: Soren Vasquez
            - item: inspection_type
              state: satisfied
              evidence_contains: Mold assessment
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Behind the dish pit there is drywall damage at the base of the wall, damp to
          the touch. Confirmed growth, condition damaged.
        expect:
          fields:
            job_address: 1201 Bricklin Street, ground floor cafe
            client: Two Rivers Hospitality
            date: April 28, 2025
            technician: Soren Vasquez
            inspection_type: Mold
