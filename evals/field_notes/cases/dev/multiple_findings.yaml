# Several distinct observations in one conversation. A new distinct location must
# become a new findings entry; elaboration on the same observation must update the
# existing entry instead of appending a duplicate.
cases:
  - case_id: fn-dev-multi-001
    split: dev
    category: multiple_findings
    tags: [asbestos, three_findings]
    description: Three distinct findings dictated across two turns.
    turns:
      - index: 1
        transcript: >-
          Asbestos survey, 415 Thistlewood Drive, main house. Camille Okafor,
          March 19 2025, client Brightwater Homes, job PT-8801. Basement first, boiler
          room pipe insulation is the old wrap, torn in two places, suspect, friable.
        expect:
          fields:
            job_address: 415 Thistlewood Drive, main house
            job_number: PT-8801
            client: Brightwater Homes
            date: March 19, 2025
            technician: Camille Okafor
            inspection_type: Asbestos
          findings:
            - location_area: Basement boiler room
              material_condition: Old pipe insulation wrap, torn in two places
              suspect_status: Suspect
              condition: Friable
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 415 Thistlewood Drive
            - item: date
              state: satisfied
              evidence_contains: March 19
            - item: technician
              state: satisfied
              evidence_contains: Camille Okafor
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Upstairs now. Kitchen has nine by nine floor tile under the newer vinyl, tile
          is intact, suspect, condition good. And the attic has vermiculite type loose
          fill insulation between the joists, undisturbed, suspect, condition good.
        expect:
          fields:
            job_address: 415 Thistlewood Drive, main house
            job_number: PT-8801
            client: Brightwater Homes
            date: March 19, 2025
            technician: Camille Okafor
            inspection_type: Asbestos
          findings:
            - location_area: Basement boiler room
              material_condition: Old pipe insulation wrap, torn in two places
              suspect_status: Suspect
              condition: Friable
            - location_area: Kitchen
              material_condition: 9x9 floor tile beneath newer vinyl, intact
              suspect_status: Suspect
              condition: Good
            - location_area: Attic, between joists
              material_condition: Vermiculite-type loose fill insulation, undisturbed
              suspect_status: Suspect
              condition: Good
          preserved_fields: [job_address, job_number, client, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 415 Thistlewood Drive
            - item: date
              state: satisfied
              evidence_contains: March 19
            - item: technician
              state: satisfied
              evidence_contains: Camille Okafor
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review

  - case_id: fn-dev-multi-002
