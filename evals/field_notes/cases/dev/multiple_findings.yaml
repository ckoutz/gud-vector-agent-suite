          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 1201 Bricklin Street
            - item: date
              state: satisfied
              evidence_contains: April 28
            - item: technician
              state: satisfied
              evidence_contains: Soren Vasquez
            - item: inspection_type
              state: satisfied
              evidence_contains: Mold assessment
          follow_up:
            needed: false
          status: ready_for_review
      - index: 3
        transcript: >-
          More on that same dish pit wall, the damage runs about four feet along the base
          and the baseboard is swollen. Same spot, just adding detail.
        expect:
          fields:
            job_address: 1201 Bricklin Street, ground floor cafe
            client: Two Rivers Hospitality
            date: April 28, 2025
            technician: Soren Vasquez
            inspection_type: Mold
          findings:
            - location_area: Behind the dish pit, base of wall
              material_condition: >-
                Damp drywall damage running about four feet along the base with a swollen
                baseboard
              suspect_status: Confirmed
              condition: Damaged
          preserved_fields: [job_address, client, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 1201 Bricklin Street
            - item: date
              state: satisfied
              evidence_contains: April 28
            - item: technician
              state: satisfied
              evidence_contains: Soren Vasquez
            - item: inspection_type
              state: satisfied
              evidence_contains: Mold assessment
          forbidden_facts:
            - field: findings
              reason: the second utterance elaborates the same observation, it is not a new finding
              forbidden_values: ["four feet along the base and the baseboard is swollen only"]
          follow_up:
            needed: false
          status: ready_for_review

  - case_id: fn-dev-multi-003
