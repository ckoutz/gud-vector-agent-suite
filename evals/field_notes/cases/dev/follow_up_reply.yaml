    turns:
      - index: 1
        transcript: >-
          Asbestos survey at 3 Fennimore Close, the bungalow. September 12 2026, client
          Oakhurst Care.
        expect:
          fields:
            job_address: 3 Fennimore Close, bungalow
            client: Oakhurst Care
            date: September 12, 2026
            inspection_type: Asbestos
          critical_gaps: [technician]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 3 Fennimore Close
            - item: date
              state: satisfied
              evidence_contains: September 12
            - item: technician
              state: missing
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: true
            target: technician
            topic: technician on site
          status: need_more_info
      - index: 2
        transcript: >-
          Hang on, someone is at the door. Same crew as last time on this one anyway.
        expect:
          fields:
            job_address: 3 Fennimore Close, bungalow
            client: Oakhurst Care
            date: September 12, 2026
            inspection_type: Asbestos
          critical_gaps: [technician]
          preserved_fields: [job_address, client, date, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 3 Fennimore Close
            - item: date
              state: satisfied
              evidence_contains: September 12
            - item: technician
              state: missing
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          forbidden_facts:
            - field: technician
