            job_address: 3 Fennimore Close, bungalow
            client: Oakhurst Care
            date: September 12, 2026
            technician: Junius Ferrell
            inspection_type: Asbestos
          preserved_fields: [job_address, client, date, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 3 Fennimore Close
            - item: date
              state: satisfied
              evidence_contains: September 12
            - item: technician
              state: satisfied
              evidence_contains: Junius Ferrell
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review

  - case_id: fn-dev-followup-004
    split: dev
    category: follow_up_reply
    tags: [contradiction_reply]
    description: A reply resolves a flagged contradiction and the note becomes ready.
    turns:
      - index: 1
        transcript: >-
          Mold inspection at 55 Winterbourne Row, basement flat. Technician Elke Sandoval,
          October 8 2026. Pipe lagging in the cupboard is friable and I would call it
          suspect ACM, and there is no damp anywhere in the flat.
        expect:
          fields:
            job_address: 55 Winterbourne Row, basement flat
            date: October 8, 2026
            technician: Elke Sandoval
            inspection_type: Mold
          findings:
            - location_area: Cupboard pipe lagging
              material_condition: Friable lagging, suspect asbestos containing material
              suspect_status: Suspect
              condition: Friable
          contradiction: >-
            inspection_type is Mold but the only finding is suspect asbestos and no damp
            was found
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 55 Winterbourne Row
            - item: date
              state: satisfied
              evidence_contains: October 8
            - item: technician
              state: satisfied
              evidence_contains: Elke Sandoval
            - item: inspection_type
              state: satisfied
              evidence_contains: Mold inspection
          follow_up:
            needed: true
            target: inspection_type
            topic: whether this is a mold or asbestos scope
          status: need_more_info
      - index: 2
        transcript: >-
          Good catch, it is an asbestos job. The mold call-out was cancelled last week and
          I read the wrong line on the schedule.
        expect:
          fields:
            job_address: 55 Winterbourne Row, basement flat
            date: October 8, 2026
            technician: Elke Sandoval
            inspection_type: Asbestos
          findings:
            - location_area: Cupboard pipe lagging
              material_condition: Friable lagging, suspect asbestos containing material
              suspect_status: Suspect
              condition: Friable
          preserved_fields: [job_address, date, technician]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 55 Winterbourne Row
            - item: date
              state: satisfied
              evidence_contains: October 8
            - item: technician
              state: satisfied
              evidence_contains: Elke Sandoval
            - item: inspection_type
              state: satisfied
              evidence_contains: it is an asbestos job
          follow_up:
            needed: false
          status: ready_for_review
