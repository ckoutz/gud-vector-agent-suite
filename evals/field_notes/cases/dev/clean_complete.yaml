# Clean, complete dictations. Every critical item is stated outright, nothing is
# contradictory, and no question is warranted at any turn. All content is synthetic:
# addresses, people, clients and job numbers are invented.
cases:
  - case_id: fn-dev-clean-001
    split: dev
    category: clean_complete
    tags: [asbestos, residential]
    description: Two-turn dictation stating every critical item, then one finding.
    turns:
      - index: 1
        transcript: >-
          Okay, this is Marisol Vega, asbestos inspection at 1420 Kenmore Avenue,
          building B. Job number PT-4471, client is Harborline Property Group, date is
          March 4, 2025. Building is a two-story brick walk-up, about 1962.
        expect:
          fields:
            job_address: 1420 Kenmore Avenue, building B
            job_number: PT-4471
            client: Harborline Property Group
            date: March 4, 2025
            technician: Marisol Vega
            inspection_type: Asbestos
            building_type_age: Two-story brick walk-up, about 1962
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 1420 Kenmore Avenue
            - item: date
              state: satisfied
              evidence_contains: March 4, 2025
            - item: technician
              state: satisfied
              evidence_contains: Marisol Vega
            - item: inspection_type
              state: satisfied
              evidence_contains: asbestos inspection
          forbidden_facts:
            - field: samples
              reason: no samples were mentioned on this turn
              forbidden_values: ["sample"]
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Accessed the basement mechanical room and both stairwells. Pipe insulation on
          the boiler header looks like the original cementitious wrap, intact, no visible
          damage. Calling it suspect, condition good. Nothing else stood out.
        expect:
          fields:
            job_address: 1420 Kenmore Avenue, building B
            job_number: PT-4471
            client: Harborline Property Group
            date: March 4, 2025
            technician: Marisol Vega
            inspection_type: Asbestos
            building_type_age: Two-story brick walk-up, about 1962
            areas_accessed: Basement mechanical room and both stairwells
          tolerated_fields: [general_condition_notes, technician_summary]
          findings:
            - location_area: Basement mechanical room, boiler header
              material_condition: Original cementitious pipe insulation wrap, intact
              suspect_status: Suspect
              condition: Good
          preserved_fields: [job_address, job_number, client, date, technician]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 1420 Kenmore Avenue
            - item: date
              state: satisfied
              evidence_contains: March 4, 2025
            - item: technician
              state: satisfied
              evidence_contains: Marisol Vega
            - item: inspection_type
              state: satisfied
              evidence_contains: asbestos inspection
          follow_up:
            needed: false
          status: ready_for_review

