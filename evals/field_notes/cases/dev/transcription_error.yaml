# Machine-transcription artifacts around technical terms and proper nouns. Obvious
# artifacts must be recovered from context, not stored verbatim. Where the intended
# spelling of a name is genuinely uncertain, the field is tolerated in field scoring
# and judged by permissible inference instead.
cases:
  - case_id: fn-dev-transcript-001
    split: dev
    category: transcription_error
    tags: [garbled_material_terms]
    description: "\"as best us\" and \"transient board\" must resolve to asbestos and transite."
    turns:
      - index: 1
        transcript: >-
          This is an as best us survey at 31 Woodgrange Avenue, rear extension. Technician
          Callum Reyes, March 5 2026.
        expect:
          fields:
            job_address: 31 Woodgrange Avenue, rear extension
            date: March 5, 2026
            technician: Callum Reyes
            inspection_type: Asbestos
          permissible_inferences:
            - field: inspection_type
              allowed_values: [Asbestos]
              rationale: "\"as best us\" is a transcription artifact for asbestos"
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 31 Woodgrange Avenue
            - item: date
              state: satisfied
              evidence_contains: March 5
            - item: technician
              state: satisfied
              evidence_contains: Callum Reyes
            - item: inspection_type
              state: inferred
              evidence_contains: as best us survey
          forbidden_facts:
            - field: inspection_type
              reason: the artifact must not be stored verbatim
              forbidden_values: ["as best us", "best us"]
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Transient board panel on the flank wall of the extension, hairline crack at the
          bottom edge, suspect, condition good.
        expect:
          fields:
            job_address: 31 Woodgrange Avenue, rear extension
            date: March 5, 2026
            technician: Callum Reyes
            inspection_type: Asbestos
          findings:
            - location_area: Flank wall of the rear extension
              material_condition: Transite board panel with a hairline crack at the bottom edge
              suspect_status: Suspect
              condition: Good
          preserved_fields: [job_address, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 31 Woodgrange Avenue
            - item: date
              state: satisfied
              evidence_contains: March 5
            - item: technician
              state: satisfied
              evidence_contains: Callum Reyes
            - item: inspection_type
              state: inferred
              evidence_contains: as best us survey
          follow_up:
            needed: false
          status: ready_for_review

