          December 1 2026, client Tidebank Regeneration, job PT-3390. Ceiling tiles are
          intact throughout, suspect, condition good.
        expect:
          fields:
            job_address: 400 Halloway Wharf, unit 6
            job_number: PT-3390
            client: Tidebank Regeneration
            date: December 1, 2026
            technician: Marguerite Oyelaran
            inspection_type: Pre-Demo
          findings:
            - location_area: Throughout unit 6
              material_condition: Ceiling tiles, intact
              suspect_status: Suspect
              condition: Good
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 400 Halloway Wharf
            - item: date
              state: satisfied
              evidence_contains: December 1
            - item: technician
              state: satisfied
              evidence_contains: Marguerite Oyelaran
            - item: inspection_type
              state: satisfied
              evidence_contains: Pre-demo survey
