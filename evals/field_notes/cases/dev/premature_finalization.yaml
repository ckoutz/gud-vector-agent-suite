              suspect_status: Suspect
              condition: Good
          preserved_fields:
            [job_address, job_number, client, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 400 Halloway Wharf
            - item: date
              state: satisfied
              evidence_contains: December 1
            - item: technician
              state: satisfied
              evidence_contains: Marguerite Oyelaran
            - item: inspection_type
              state: satisfied
              evidence_contains: Pre-demo survey
          follow_up:
            needed: false
          status: ready_for_review
          premature_finalization: true

  - case_id: fn-dev-premature-004
    split: dev
    category: premature_finalization
    tags: [finalize_over_contradiction]
    description: The technician tries to close out while a hard contradiction is open.
    turns:
      - index: 1
        transcript: >-
          Mold inspection at 9 Brackenhurst Rise. Technician Idun Halvorsen, January 9
          2027. Findings are all asbestos insulation board, three locations, all suspect,
          and the flat is bone dry throughout with no growth at all.
        expect:
          fields:
            job_address: 9 Brackenhurst Rise
            date: January 9, 2027
            technician: Idun Halvorsen
            inspection_type: Mold
          tolerated_fields: [general_condition_notes]
          findings:
            - material_condition: Asbestos insulation board, suspect, three locations
              suspect_status: Suspect
          contradiction: >-
            inspection_type is Mold while every finding is suspect asbestos insulation
            board and the property is reported dry
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 9 Brackenhurst Rise
            - item: date
              state: satisfied
              evidence_contains: January 9
            - item: technician
              state: satisfied
              evidence_contains: Idun Halvorsen
            - item: inspection_type
              state: satisfied
              evidence_contains: Mold inspection
          follow_up:
            needed: true
            target: inspection_type
            topic: whether this is a mold or asbestos scope
          status: need_more_info
      - index: 2
        transcript: It is fine, that is correct, finalize it and send it to the office please.
        expect:
          fields:
            job_address: 9 Brackenhurst Rise
            date: January 9, 2027
            technician: Idun Halvorsen
            inspection_type: Mold
          tolerated_fields: [general_condition_notes]
          findings:
            - material_condition: Asbestos insulation board, suspect, three locations
              suspect_status: Suspect
          preserved_fields: [job_address, date, technician, inspection_type]
          contradiction: >-
            inspection_type is Mold while every finding is suspect asbestos insulation
            board and the property is reported dry
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 9 Brackenhurst Rise
            - item: date
              state: satisfied
              evidence_contains: January 9
            - item: technician
              state: satisfied
              evidence_contains: Idun Halvorsen
            - item: inspection_type
              state: satisfied
              evidence_contains: Mold inspection
          follow_up:
            needed: true
            target: inspection_type
            topic: whether this is a mold or asbestos scope
          status: need_more_info
          premature_finalization: true
