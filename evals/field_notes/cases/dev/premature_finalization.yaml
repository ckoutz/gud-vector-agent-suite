            - item: job_address
              state: satisfied
              evidence_contains: 12 Ashcombe Vale
            - item: date
              state: satisfied
              evidence_contains: November 3
            - item: technician
              state: missing
            - item: inspection_type
              state: satisfied
              evidence_contains: Lead inspection
          follow_up:
            needed: true
            target: technician
            topic: technician on site
          status: need_more_info
          premature_finalization: true

