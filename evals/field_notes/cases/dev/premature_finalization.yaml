# Finalization language ("that's it", "looks good, send it") must not by itself make a
# note ready. Where the note genuinely is complete, the same language must not cause a
# spurious question either.
cases:
  - case_id: fn-dev-premature-001
    split: dev
    category: premature_finalization
    tags: [send_it, gap_remains]
    description: "\"Send it\" while the date is still unknown."
    turns:
      - index: 1
        transcript: >-
          Asbestos survey at 88 Larkspur Walk, the maisonette. Technician Bo Hallberg,
          client Pinehaven Estates. Floor tile in the hall is intact, suspect, good.
        expect:
          fields:
            job_address: 88 Larkspur Walk, maisonette
            client: Pinehaven Estates
            technician: Bo Hallberg
            inspection_type: Asbestos
          critical_gaps: [date]
          findings:
            - location_area: Hall
              material_condition: Floor tile, intact
              suspect_status: Suspect
              condition: Good
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 88 Larkspur Walk
            - item: date
              state: missing
            - item: technician
              state: satisfied
              evidence_contains: Bo Hallberg
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: true
            target: date
            topic: date of the visit
          status: need_more_info
      - index: 2
        transcript: That is everything, looks good, send it through to the office.
        expect:
          fields:
            job_address: 88 Larkspur Walk, maisonette
            client: Pinehaven Estates
            technician: Bo Hallberg
            inspection_type: Asbestos
          critical_gaps: [date]
          findings:
            - location_area: Hall
              material_condition: Floor tile, intact
              suspect_status: Suspect
              condition: Good
          preserved_fields: [job_address, client, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 88 Larkspur Walk
            - item: date
              state: missing
            - item: technician
              state: satisfied
              evidence_contains: Bo Hallberg
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          forbidden_facts:
            - field: date
              reason: finalization language is not a date
          follow_up:
            needed: true
            target: date
            topic: date of the visit
          status: need_more_info
          premature_finalization: true

