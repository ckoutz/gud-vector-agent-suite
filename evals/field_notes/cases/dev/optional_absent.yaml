# Optional fields are absent and must never trigger a follow-up. These cases fail a
# candidate that chases samples, photos, site-overview detail or summary text.
cases:
  - case_id: fn-dev-optional-001
    split: dev
    category: optional_absent
    tags: [asbestos, no_samples]
    description: Complete critical items, no samples, no photos, no summary. No question allowed.
    turns:
      - index: 1
        transcript: >-
          Asbestos inspection, 55 Denbigh Street rear unit. Anneke Post, date is
          May 6 2025.
        expect:
          fields:
            job_address: 55 Denbigh Street, rear unit
            date: May 6, 2025
            technician: Anneke Post
            inspection_type: Asbestos
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 55 Denbigh Street
            - item: date
              state: satisfied
              evidence_contains: May 6
            - item: technician
              state: satisfied
              evidence_contains: Anneke Post
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos inspection
          forbidden_facts:
            - field: job_number
              reason: never stated
            - field: client
              reason: never stated
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Vinyl sheet flooring in the kitchen, seams lifting near the sink. Suspect,
          damaged. No samples today, I did not have the kit with me, and I did not take
          photos.
        expect:
          fields:
            job_address: 55 Denbigh Street, rear unit
            date: May 6, 2025
            technician: Anneke Post
            inspection_type: Asbestos
          tolerated_fields: [missing_info, flags_for_office_review, recommended_next_steps]
          findings:
            - location_area: Kitchen
              material_condition: Vinyl sheet flooring, seams lifting near the sink
              suspect_status: Suspect
              condition: Damaged
          preserved_fields: [job_address, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 55 Denbigh Street
            - item: date
              state: satisfied
              evidence_contains: May 6
            - item: technician
              state: satisfied
              evidence_contains: Anneke Post
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos inspection
          forbidden_facts:
            - field: samples
              reason: technician explicitly collected no samples
              forbidden_values: ["kitchen"]
            - field: photos
              reason: technician explicitly took no photos
              forbidden_values: ["img"]
          follow_up:
            needed: false
          status: ready_for_review

