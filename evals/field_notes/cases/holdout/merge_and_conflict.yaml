        transcript: >-
          Asbestos survey at 130 Yewbank Road, unit 2. Technician Casper Nwosu,
          November 21 2027. Insulating board panel in the airing cupboard, intact,
          suspect, good.
        expect:
          fields:
            job_address: 130 Yewbank Road, unit 2
            date: November 21, 2027
            technician: Casper Nwosu
            inspection_type: Asbestos
          findings:
            - location_area: Airing cupboard
              material_condition: Insulating board panel, intact
              suspect_status: Suspect
              condition: Good
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 130 Yewbank Road
            - item: date
              state: satisfied
              evidence_contains: November 21
            - item: technician
              state: satisfied
              evidence_contains: Casper Nwosu
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          That panel is in the meter cupboard, not the airing cupboard. Board itself is as
