# Held out for final selection only. Multi-finding merges, corrections,
# contradictions, and transcription artifacts.
cases:
  - case_id: fn-hold-multi-001
    split: holdout
    category: multiple_findings
    tags: [asbestos, four_findings, elaboration]
    description: Three new findings then an elaboration that must not become a fourth.
    turns:
      - index: 1
        transcript: >-
          Asbestos survey at 700 Marchwood Gardens, block C. Technician Delphine Aubert,
          September 30 2027, client Kirkfell Housing, job PT-6640. Riser cupboard has
          pipe lagging, intact, suspect, good. Bin store ceiling is insulating board,
          suspect, good.
        expect:
          fields:
            job_address: 700 Marchwood Gardens, block C
            job_number: PT-6640
            client: Kirkfell Housing
            date: September 30, 2027
            technician: Delphine Aubert
            inspection_type: Asbestos
          findings:
            - location_area: Riser cupboard
              material_condition: Pipe lagging, intact
              suspect_status: Suspect
              condition: Good
            - location_area: Bin store ceiling
              material_condition: Insulating board
              suspect_status: Suspect
              condition: Good
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 700 Marchwood Gardens
            - item: date
              state: satisfied
              evidence_contains: September 30
            - item: technician
              state: satisfied
              evidence_contains: Delphine Aubert
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Third one, the roof plant room has sprayed coating on the underside of the slab,
          flaking in one corner, suspect, damaged.
        expect:
          fields:
            job_address: 700 Marchwood Gardens, block C
            job_number: PT-6640
            client: Kirkfell Housing
            date: September 30, 2027
            technician: Delphine Aubert
            inspection_type: Asbestos
          findings:
            - location_area: Riser cupboard
              material_condition: Pipe lagging, intact
              suspect_status: Suspect
              condition: Good
            - location_area: Bin store ceiling
              material_condition: Insulating board
              suspect_status: Suspect
              condition: Good
            - location_area: Roof plant room, underside of slab
              material_condition: Sprayed coating, flaking in one corner
              suspect_status: Suspect
              condition: Damaged
          preserved_fields: [job_address, job_number, client, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 700 Marchwood Gardens
            - item: date
              state: satisfied
              evidence_contains: September 30
            - item: technician
              state: satisfied
              evidence_contains: Delphine Aubert
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review
      - index: 3
        transcript: >-
          Back on the plant room coating, the flaking corner is above the pump base and
          there is debris on the floor underneath it. Same location, adding detail.
        expect:
          fields:
            job_address: 700 Marchwood Gardens, block C
            job_number: PT-6640
            client: Kirkfell Housing
            date: September 30, 2027
            technician: Delphine Aubert
            inspection_type: Asbestos
          findings:
            - location_area: Riser cupboard
              material_condition: Pipe lagging, intact
              suspect_status: Suspect
              condition: Good
            - location_area: Bin store ceiling
              material_condition: Insulating board
              suspect_status: Suspect
              condition: Good
            - location_area: Roof plant room, underside of slab above the pump base
              material_condition: >-
                Sprayed coating flaking in one corner with debris on the floor underneath
              suspect_status: Suspect
              condition: Damaged
          preserved_fields: [job_address, job_number, client, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 700 Marchwood Gardens
            - item: date
              state: satisfied
              evidence_contains: September 30
            - item: technician
              state: satisfied
              evidence_contains: Delphine Aubert
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review

  - case_id: fn-hold-correction-001
    split: holdout
    category: correction
    tags: [technician_correction]
    description: The technician name is corrected; the superseded name must disappear.
    turns:
      - index: 1
        transcript: >-
          Lead inspection at 18 Sowerby Place. Technician on record is Marcus Delgado,
          October 14 2027, client Hollowbrook Homes.
        expect:
          fields:
            job_address: 18 Sowerby Place
            client: Hollowbrook Homes
            date: October 14, 2027
            technician: Marcus Delgado
            inspection_type: Lead
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 18 Sowerby Place
            - item: date
              state: satisfied
              evidence_contains: October 14
            - item: technician
              state: satisfied
              evidence_contains: Marcus Delgado
            - item: inspection_type
              state: satisfied
              evidence_contains: Lead inspection
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Correction, Marcus was scheduled but he is off sick, I covered it. Put me down,
          Renata Filipovic.
        expect:
          fields:
            job_address: 18 Sowerby Place
            client: Hollowbrook Homes
            date: October 14, 2027
            technician: Renata Filipovic
            inspection_type: Lead
          preserved_fields: [job_address, client, date, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 18 Sowerby Place
            - item: date
              state: satisfied
              evidence_contains: October 14
            - item: technician
              state: satisfied
              evidence_contains: Renata Filipovic
            - item: inspection_type
              state: satisfied
              evidence_contains: Lead inspection
          forbidden_facts:
            - field: technician
              reason: the scheduled technician did not attend
              forbidden_values: ["Marcus Delgado"]
          follow_up:
            needed: false
          status: ready_for_review

