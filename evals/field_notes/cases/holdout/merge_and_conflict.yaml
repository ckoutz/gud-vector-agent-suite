              state: satisfied
              evidence_contains: 130 Yewbank Road
            - item: date
              state: satisfied
              evidence_contains: November 21
            - item: technician
              state: satisfied
              evidence_contains: Casper Nwosu
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos survey
          follow_up:
            needed: false
          status: ready_for_review

  - case_id: fn-hold-contradiction-001
    split: holdout
    category: contradiction
    tags: [date_contradiction]
    description: Two incompatible dates are given for the same visit.
    turns:
      - index: 1
        transcript: >-
          Asbestos inspection at 24 Pellingham Street. Technician Anouk Devries,
          December 5 2027, client Thornmead Group.
        expect:
          fields:
            job_address: 24 Pellingham Street
            client: Thornmead Group
            date: December 5, 2027
            technician: Anouk Devries
            inspection_type: Asbestos
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 24 Pellingham Street
            - item: date
              state: satisfied
              evidence_contains: December 5
            - item: technician
              state: satisfied
              evidence_contains: Anouk Devries
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos inspection
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          For the record this visit was on December 5 and also the inspection took place
          on December 15, both dates are right, put them both on there.
        expect:
          fields:
            job_address: 24 Pellingham Street
            client: Thornmead Group
            date: December 5, 2027
            technician: Anouk Devries
            inspection_type: Asbestos
          preserved_fields: [job_address, client, technician, inspection_type]
          contradiction: >-
            two different inspection dates are asserted for the same single visit
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 24 Pellingham Street
            - item: date
              state: satisfied
              evidence_contains: December 5
            - item: technician
              state: satisfied
              evidence_contains: Anouk Devries
            - item: inspection_type
              state: satisfied
              evidence_contains: Asbestos inspection
          follow_up:
            needed: true
            target: date
            topic: which date the visit actually took place on
          status: need_more_info

  - case_id: fn-hold-contradiction-002
    split: holdout
    category: contradiction
    tags: [minor_ambiguity, must_not_ask]
    description: An unresolved-but-plausible reference; asking is a false follow-up.
    turns:
      - index: 1
        transcript: >-
          Pre-demo survey at 46 Stanhope Wharf, unit 9. Technician Emiliano Rustici,
          January 18 2028, client Northcliff Build.
        expect:
          fields:
            job_address: 46 Stanhope Wharf, unit 9
            client: Northcliff Build
            date: January 18, 2028
            technician: Emiliano Rustici
            inspection_type: Pre-Demo
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 46 Stanhope Wharf
            - item: date
              state: satisfied
              evidence_contains: January 18
            - item: technician
              state: satisfied
              evidence_contains: Emiliano Rustici
            - item: inspection_type
              state: satisfied
              evidence_contains: Pre-demo survey
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          Floor screed has a bitumen looking layer under it, could be from the original
          build or the nineties refit, no way to tell from here. Suspect, condition good.
          Office may already have the refit drawings.
        expect:
          fields:
            job_address: 46 Stanhope Wharf, unit 9
            client: Northcliff Build
            date: January 18, 2028
            technician: Emiliano Rustici
            inspection_type: Pre-Demo
          tolerated_fields: [flags_for_office_review, missing_info, recommended_next_steps]
          findings:
            - location_area: Floor screed
              material_condition: Bitumen-appearing layer beneath the screed, age unclear
              suspect_status: Suspect
              condition: Good
          preserved_fields: [job_address, client, date, technician, inspection_type]
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 46 Stanhope Wharf
            - item: date
              state: satisfied
              evidence_contains: January 18
            - item: technician
              state: satisfied
              evidence_contains: Emiliano Rustici
            - item: inspection_type
              state: satisfied
              evidence_contains: Pre-demo survey
          follow_up:
            needed: false
          status: ready_for_review

  - case_id: fn-hold-transcript-001
    split: holdout
    category: transcription_error
    tags: [garbled_terms, garbled_place]
    description: "\"a sbestos\" and \"crawl spays\" artifacts plus a garbled street name."
    turns:
      - index: 1
        transcript: >-
          A sbestos survey at 39 Harrowgate Rize. Technician Piotr Wiśniewski,
          February 29 2028.
        expect:
          fields:
            date: February 29, 2028
            technician: Piotr Wiśniewski
            inspection_type: Asbestos
          tolerated_fields: [job_address]
          permissible_inferences:
            - field: inspection_type
              allowed_values: [Asbestos]
              rationale: "\"a sbestos\" is a transcription artifact"
            - field: job_address
              allowed_values: [39 Harrowgate Rize, 39 Harrowgate Rise]
              rationale: street suffix spelling is uncertain but the number and name are clear
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 39 Harrowgate
            - item: date
              state: satisfied
              evidence_contains: February 29
            - item: technician
              state: satisfied
              evidence_contains: Wiśniewski
            - item: inspection_type
              state: inferred
              evidence_contains: sbestos survey
          follow_up:
            needed: false
          status: ready_for_review
      - index: 2
        transcript: >-
          In the crawl spays under the rear extension there is pipe lagging, dry and
          intact, suspect, condition good.
        expect:
          fields:
            date: February 29, 2028
            technician: Piotr Wiśniewski
            inspection_type: Asbestos
          tolerated_fields: [job_address]
          findings:
            - location_area: Crawlspace under the rear extension
              material_condition: Pipe lagging, dry and intact
              suspect_status: Suspect
              condition: Good
          preserved_fields: [date, technician, inspection_type]
          permissible_inferences:
            - field: job_address
              allowed_values: [39 Harrowgate Rize, 39 Harrowgate Rise]
              rationale: the address captured on turn one must survive
          checklist:
            - item: job_address
              state: satisfied
              evidence_contains: 39 Harrowgate
            - item: date
              state: satisfied
              evidence_contains: February 29
            - item: technician
              state: satisfied
              evidence_contains: Wiśniewski
            - item: inspection_type
              state: inferred
              evidence_contains: sbestos survey
          forbidden_facts:
            - field: findings
              reason: the artifact spelling must not be stored
              forbidden_values: ["crawl spays"]
          follow_up:
            needed: false
          status: ready_for_review
