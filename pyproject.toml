[project]
name = "gud-vector-agent-suite"
version = "0.1.0"
description = "Channel-agnostic foundation for Güd Vector Agent Suite"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15.2,<1.16",
  "asyncpg>=0.30.0,<0.31",
  "fastapi>=0.115.12,<0.116",
  "pydantic>=2.11.3,<3",
  "pydantic-settings>=2.9.1,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "uvicorn[standard]>=0.34.2,<0.35",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<0.22",
  "mypy>=1.15.0,<1.16",
  "pytest>=8.3.5,<9",
  "pytest-asyncio>=0.26.0,<0.27",
  "ruff>=0.11.6,<0.12",
]

[build-system]
requires = ["hatchling>=1.27.0,<2"
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gvas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = "src/gvas/infrastructure/migrations/"

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg.*", "aiosqlite.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
